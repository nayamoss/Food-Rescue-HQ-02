<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Rescue HQ: Rescue flow</title>
<style>
body{margin:0;background:#F7F6F3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;color:#1C1C1A}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
p{font-size:14px;color:#787774;margin:0 0 16px}
.t{font-size:14px;font-weight:600}.s{font-size:12px}
</style></head><body><div class="wrap">
<h1>Food Rescue HQ: rescue flow</h1>
<p>Gray is the admin, purple is the agent, teal is nonprofits and volunteers.</p>
<svg width="100%" viewBox="0 0 680 740" role="img" aria-label="Food Rescue HQ rescue flow">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"/></marker></defs>
<g font-family="inherit" text-anchor="middle" dominant-baseline="central">
<rect x="200" y="40" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="t" x="335" y="58" fill="#444441">Admin snaps a photo</text><text class="s" x="335" y="78" fill="#5F5E5A">Event already set up</text>
<line x1="335" y1="96" x2="335" y2="120" stroke="#888780" marker-end="url(#a)"/>
<rect x="200" y="124" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="t" x="335" y="142" fill="#3C3489">Agent reads the photo</text><text class="s" x="335" y="162" fill="#534AB7">You have about 100 tacos</text>
<line x1="335" y1="180" x2="335" y2="204" stroke="#888780" marker-end="url(#a)"/>
<rect x="200" y="208" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="t" x="335" y="226" fill="#444441">Alert nearby nonprofits?</text><text class="s" x="335" y="246" fill="#5F5E5A">Admin taps yes</text>
<line x1="470" y1="236" x2="486" y2="236" stroke="#888780" marker-end="url(#a)"/>
<rect x="490" y="208" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="t" x="565" y="226" fill="#444441">Edit the count</text><text class="s" x="565" y="246" fill="#5F5E5A">If no, back to photo</text>
<line x1="335" y1="264" x2="335" y2="288" stroke="#888780" marker-end="url(#a)"/>
<rect x="200" y="292" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="t" x="335" y="310" fill="#3C3489">Agent calls nonprofits</text><text class="s" x="335" y="330" fill="#534AB7">Everyone nearby at once</text>
<line x1="335" y1="348" x2="335" y2="372" stroke="#888780" marker-end="url(#a)"/>
<rect x="200" y="376" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="t" x="335" y="394" fill="#085041">First nonprofit says yes</text><text class="s" x="335" y="414" fill="#0F6E56">The food is theirs</text>
<line x1="470" y1="404" x2="486" y2="404" stroke="#888780" marker-end="url(#a)"/>
<rect x="490" y="376" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="t" x="565" y="394" fill="#085041">Others notified</text><text class="s" x="565" y="414" fill="#0F6E56">It is taken</text>
<line x1="200" y1="404" x2="184" y2="404" stroke="#888780" marker-end="url(#a)"/>
<rect x="40" y="376" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="t" x="110" y="394" fill="#444441">No one in time</text><text class="s" x="110" y="414" fill="#5F5E5A">Admin is told</text>
<line x1="335" y1="432" x2="335" y2="456" stroke="#888780" marker-end="url(#a)"/>
<rect x="200" y="460" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="t" x="335" y="478" fill="#3C3489">Agent alerts volunteers</text><text class="s" x="335" y="498" fill="#534AB7">Pickup and drop-off</text>
<line x1="335" y1="516" x2="335" y2="540" stroke="#888780" marker-end="url(#a)"/>
<rect x="200" y="544" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="t" x="335" y="562" fill="#085041">Volunteer accepts</text><text class="s" x="335" y="582" fill="#0F6E56">Picks up, drops off</text>
<line x1="335" y1="600" x2="335" y2="624" stroke="#888780" marker-end="url(#a)"/>
<rect x="200" y="628" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="t" x="335" y="646" fill="#444441">Rescue done</text><text class="s" x="335" y="666" fill="#5F5E5A">Summary for the admin</text>
</g></svg>
</div></body></html>
